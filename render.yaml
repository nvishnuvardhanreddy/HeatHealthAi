services:
  # Django REST backend
  - type: web
    name: heathealthai-backend
    runtime: python
    buildCommand: "bash backend/build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120"
    plan: free
    healthCheckPath: /api/health/

    envVars:
      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: heathealthai-db
          property: connectionString

      - key: CORS_ALLOWED_ORIGINS
        value: "https://heathealthai-frontend-rysd.onrender.com,https://heathealthai-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173"

      - key: DEMO_MODE
        value: "True"

      - key: INDIA_WIDE_MODE
        value: "True"

      - key: ALERT_COOLDOWN_MINUTES
        value: "120"

      - key: GOVERNMENT_EMAIL_DOMAINS
        value: "gov.in,nic.in,ap.gov.in"

      # Web Push (default demo keys provided)
      - key: VAPID_PUBLIC_KEY
        value: "BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjZJuHLSatflLRnvOncsvzsPpuw1U"

      - key: VAPID_PRIVATE_KEY
        value: "yK36zWfXv0m9L7W9v3Z_8W_8Y8V0nL8_3n_W7v0L3Z8"

      - key: VAPID_EMAIL
        value: "mailto:heathealthai96@gmail.com"

      # Gmail SMTP
      - key: EMAIL_HOST
        value: "smtp.gmail.com"

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_HOST_USER
        value: "heathealthai96@gmail.com"

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: EMAIL_USE_TLS
        value: "True"

      - key: DEFAULT_FROM_EMAIL
        value: "HeatHealthAI <heathealthai96@gmail.com>"

  # React frontend static site
  - type: web
    name: heathealthai-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    pullRequestPreviewsEnabled: true

    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"

    envVars:
      - key: VITE_API_BASE_URL
        value: "https://heathealthai-backend-r5fu.onrender.com/api"

databases:
  # Free PostgreSQL database
  - name: heathealthai-db
    databaseName: heathealthai
    user: heathealth_user
    plan: free