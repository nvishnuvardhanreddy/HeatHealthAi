services:
  # Django REST backend
  - type: web
    name: heathealthai-backend
    runtime: python
    buildCommand: "./backend/build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    plan: standard
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: heathealthai-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: heathealthai-redis
          property: connectionString

      - key: CORS_ALLOWED_ORIGINS
        value: "https://heathealthai-frontend.onrender.com"

      - key: DEMO_MODE
        value: "True"

      - key: INDIA_WIDE_MODE
        value: "True"

      - key: ALERT_COOLDOWN_MINUTES
        value: "120"

      - key: GOVERNMENT_EMAIL_DOMAINS
        value: "gov.in,nic.in,ap.gov.in"

      # Web Push secrets
      - key: VAPID_PUBLIC_KEY
        sync: false

      - key: VAPID_PRIVATE_KEY
        sync: false

      - key: VAPID_EMAIL
        value: "mailto:heathealthai96@gmail.com"

      # Gmail SMTP secrets
      - key: EMAIL_HOST
        value: "smtp.gmail.com"

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_HOST_USER
        sync: false

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: EMAIL_USE_TLS
        value: "True"

      - key: DEFAULT_FROM_EMAIL
        sync: false

  # Celery worker
  - type: worker
    name: heathealthai-celery-worker
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && celery -A config worker --loglevel=info --concurrency=2"
    plan: standard
    envVars:
      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: heathealthai-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: heathealthai-redis
          property: connectionString

  # Redis
  - type: redis
    name: heathealthai-redis
    ipAllowList: []
    plan: starter

  # React frontend
  - type: web
    name: heathealthai-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://heathealthai-backend.onrender.com/api"

databases:
  # PostgreSQL database
  - name: heathealthai-db
    databaseName: heathealthai
    user: heathealth_user
    plan: standard