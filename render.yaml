services:
  # HeatHealthAI Unified Production Web Service (Django REST Backend + Dashboard 1 Frontend + ML Inference)
  - type: web
    name: heathealthai
    runtime: python
    buildCommand: "bash backend/build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free
    healthCheckPath: /health

    envVars:
      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: heathealthai-db
          property: connectionString

      - key: CORS_ALLOWED_ORIGINS
        value: "https://heathealth-ai.onrender.com,https://heathealthai.onrender.com,https://heathealthai-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000"

      - key: DEMO_MODE
        value: "False"

      - key: INDIA_WIDE_MODE
        value: "True"

      - key: ALERT_COOLDOWN_MINUTES
        value: "120"

      - key: GOVERNMENT_EMAIL_DOMAINS
        value: "gov.in,nic.in,ap.gov.in"

      # Web Push (standard demo VAPID keys)
      - key: VAPID_PUBLIC_KEY
        value: "BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjZJuHLSatflLRnvOncsvzsPpuw1U"

      - key: VAPID_PRIVATE_KEY
        value: "yK36zWfXv0m9L7W9v3Z_8W_8Y8V0nL8_3n_W7v0L3Z8"

      - key: VAPID_EMAIL
        value: "mailto:heathealthai96@gmail.com"

      # Email SMTP Configuration
      - key: EMAIL_HOST
        value: "smtp.gmail.com"

      - key: EMAIL_PORT
        value: "587"

      - key: EMAIL_HOST_USER
        value: "heathealthai96@gmail.com"

      - key: EMAIL_HOST_PASSWORD
        sync: false

      - key: EMAIL_USE_TLS
        value: "True"

      - key: DEFAULT_FROM_EMAIL
        value: "HeatHealthAI <heathealthai96@gmail.com>"

databases:
  # Free PostgreSQL Database
  - name: heathealthai-db
    databaseName: heathealthai
    user: heathealth_user
    plan: free